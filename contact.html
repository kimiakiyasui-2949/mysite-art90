<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beauty | Kento Utsubo</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* ===== RESET ===== */
html, body{
  margin:0;
  padding:0;
  height:100%;
}

/* ===== BODY ===== */
body{
  background:#f5f4f2;
  color:#98996e;
  font-family:"DM Serif Display", serif;
  display:flex;
  flex-direction:column;
}

/* ===== CONTENT ===== */
.content{
  flex:1;
}

/* ===== TITLE ===== */
.title{
  padding:40px 0;
  text-align:center;
}

.title h1{
  font-size:14px;
  letter-spacing:0.3em;
  margin:0;
  cursor:pointer;
}

.title h2{
  font-size:26px;
  letter-spacing:0.25em;
  margin:10px 0;
}

.title h4{
  font-size:12px;
  letter-spacing:0.2em;
  margin-top:15px;
}

/* ===== MANU MENU ===== */
.manu-menu{
  opacity:0;
  max-height:0;
  overflow:hidden;
  transition:0.5s ease;
}

.manu-menu.show{
  opacity:1;
  max-height:500px;
}

.manu-menu a{
  display:block;
  margin:10px 0;
  font-size:16px;
  letter-spacing:0.2em;
  text-decoration:none;
  color:#ed2121;
}

.manu-menu a:hover{
  opacity:0.6;
}

/* ===== GALLERY ===== */
.vertical-gallery{
  max-width:800px;
  margin:0 auto 60px;
}

.vertical-gallery img{
  width:100%;
  display:block;
  margin-bottom:40px;
}

/* ===== CONTACT FORM ===== */
#contactForm{
  position:fixed;
  left:20px;
  bottom:20px;
  width:260px;
  padding:20px;
  background:rgba(245,244,242,0.95);
  font-family:"Montserrat", sans-serif;
  z-index:1000;
}

#contactForm input,
#contactForm textarea{
  width:100%;
  padding:8px 0;
  margin-bottom:12px;
  border:none;
  border-bottom:1px solid #98996e;
  background:transparent;
  font-size:12px;
}

#contactForm input:focus,
#contactForm textarea:focus{
  outline:none;
  border-bottom:1px solid #ed2121;
}

#contactForm button{
  width:100%;
  padding:10px;
  border:none;
  background:#121212;
  color:#f6f1f1;
  font-size:12px;
  letter-spacing:0.2em;
  cursor:pointer;
}

#contactForm button:hover{
  opacity:0.8;
}

/* ===== FOOTER ===== */
footer{
  text-align:left;
  padding:10px;
  font-size:12px;
  color:#090909;
}
</style>
</head>

<body>

<div class="content">

  <div class="title">
    <h1 onclick="toggleManu()">MANU</h1>
    <h2>KENTO UTSUBO</h2>
    <h4>CONTACT</h4>

    <div class="manu-menu" id="manuMenu">
      <a href="index.html">HOME</a>
      <a href="work.html">WORK</a>
      <a href="beauty.html">BEAUTY</a>
      <a href="profile.html">PROFILE</a>
    </div>
  </div>

  <!-- ギャラリー（必要なら画像追加） -->
  <div class="vertical-gallery">
    <!-- <img src="img01.jpg"> -->
    <!-- <img src="img02.jpg"> -->
  </div>

</div>

<!-- CONTACT FORM -->
<div id="contactForm">
  <form
    action="https://formsubmit.co/yourmail@gmail.com"
    method="POST"
    autocomplete="on"
  >
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://kimiakiyasui-2949.github.io/-12/index.html">

    <input type="text" name="name" placeholder="Name" required autocomplete="name">
    <input type="email" name="email" placeholder="Email" required autocomplete="email">
    <textarea name="message" placeholder="Message" required autocomplete="off"></textarea>

    <button type="submit">SEND</button>
  </form>
</div>

<footer>
  <p>© Kimiaki Yasui</p>
</footer>

<script>
function toggleManu(){
  document.getElementById("manuMenu").classList.toggle("show");
}
</script>

</body>
</html>
