<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display:ital@0;1&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beauty | Kento Utsubo</title>

<style>
html, body {
  margin:0;
  padding:0;
  height:100%;
}

body{
  font-family:Arial, sans-serif;
  background:#fff;
  color:#000;
  display:flex;
  flex-direction:column;
  font-family: "DM Serif Display", serif;
}

/* ===== コンテンツ ===== */
.content{
  flex:1; /* フッター以外の部分が伸びる */
  padding-bottom:40px;
}

/* タイトル部分 */
.title{
  padding:40px 0;
  text-align:center;
}

.title h1{
  font-size:14px;
  letter-spacing:0.2em;
  margin:0;
  cursor:pointer;
}

.title h2{
  font-size:26px;
  letter-spacing:0.25em;
  margin:10px 0 0;
}

/* ===== 縦並びギャラリー ===== */
.vertical-gallery{
  max-width:800px;
  margin:0 auto;
  margin-bottom:40px;
}

.vertical-gallery img{
  width:100%;
  display:block;
  margin-bottom:40px; 
}

/* ===== MANU メニュー ===== */
.manu-menu{
  opacity:0;
  max-height:0;
  overflow:hidden;
  transition: opacity 0.5s ease, max-height 0.5s ease;
  text-align:center;
  margin-top:10px;
}

.manu-menu.show{
  opacity:1;
  max-height:500px; /* 十分な高さ */
}

.manu-menu a{
  display:block;
  font-size:18px;
  letter-spacing:0.2em;
  margin:10px 0;
  text-decoration:none;
  color:#f20a0a;
}

.manu-menu a:hover{
  opacity:0.6;
}

/* ===== CONTACT FORM 左下固定 ===== */
#contactForm{

  left:20px;
  bottom:40px;
  background:#fff;
  padding:20px;
  width:300px;
  z-index:1000;
}

#contactForm input, #contactForm textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}

/* ===== FOOTER ===== */
footer{
  text-align:center;
  padding:10px;
  font-size:12px;
  color:#666;
  background:#f5f5f5;
}
</style>
</head>

<body>

<div class="content">

  <div class="title">
    <h1 onclick="toggleManu()">MANU</h1>
    <h2>KENTO UTSUBO</h2>
     <H4>CONTACT</H4>
    <div class="manu-menu" id="manuMenu">
      <a href="index.html">HOME</a>
      <a href="work.html">WORK</a>
      <a href="beauty.html">BEAUTY</a>
      <a href="profile.html">PROFILE</a>
    </div>
  </div>

 

</div>

<!-- 左下のメールフォーム -->
<form id="contactForm" action="mailto:yourmail@gmail.com" method="post" enctype="text/plain">
  <input type="text" name="name" placeholder="Name">
  <input type="email" name="email" placeholder="Email">
  <textarea name="message" rows="5" placeholder="Message"></textarea>
  <button type="submit">Send</button>
</form>

<footer>
  <p>Kimiaki Yasui</p>
</footer>

<script>
function toggleManu(){
  const menu = document.getElementById('manuMenu');
  menu.classList.toggle('show');
}
</script>

</body>
</html>
