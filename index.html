<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu / Work / Beauty</title>
<style>
 body {
   margin: 0;
   font-family: Arial, sans-serif;
 }
 .header {
   text-align: center;
   padding: 20px;
   font-size: 32px;
   font-weight: bold;
 }

 .nav {
   text-align: center;
   margin-bottom: 20px;
 }
 .nav a, .nav p {
   margin: 0 15px;
   font-size: 20px;
   cursor: pointer;
   text-decoration: none;
   color: black;
   display: inline-block;
 }
 .hero {
   width: 100%;
   height: 100vh;
   background-size: cover;
   background-position: center;
 }
 .gallery {
   display: none;
   padding: 20px;
   grid-template-columns: repeat(4, 1fr);
   gap: 10px;
 }
 .gallery img {
   width: 100%;
   cursor: pointer;
 }
 .viewer {
   display: none;
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background: rgba(0,0,0,0.8);
   justify-content: center;
   align-items: center;
 }
 .viewer img {
   max-width: 80%;
   max-height: 80%;
 }
 #contactPage {
   display: none;
   text-align: center;
   padding: 40px;
   font-size: 24px;
 }
</style>
</head>
<body>

<div class="header">Ustubo Kento</div>

<div class="nav">
  <p onclick="showMenu()">menu</p>
  <a id="workBtn" onclick="showWork()" style="display:none;">work</a>
  <a id="beautyBtn" onclick="showBeauty()" style="display:none;">beauty</a>
  <a id="contactBtn" onclick="showContact()" style="display:none;">contact</a>
</div>

<div id="hero" class="hero" style="background-image:url('beach.jpg');"></div>

<div id="workGallery" class="gallery">
  <img src="30.jpg" onclick="openViewer(this.src)">
  <img src="110st newyork.jpg" onclick="openViewer(this.src)">
  <img src="a-to.jpg" onclick="openViewer(this.src)">
  <img src="aunt1.jpg" onclick="openViewer(this.src)">
  <img src="black.jpg" onclick="openViewer(this.src)">
  <img src="Id 324.jpg" onclick="openViewer(this.src)">
  <img src="red.jpg" onclick="openViewer(this.src)">
  <img src="road.jpg" onclick="openViewer(this.src)">
  <img src="street.jpg" onclick="openViewer(this.src)">
  <img src="ao.jpg" onclick="openViewer(this.src)">
  <img src="bill.jpg" onclick="openViewer(this.src)">
  <img src="kyoti.jpg" onclick="openViewer(this.src)">
</div>

<div id="beautyGallery" class="gallery">
  <img src="river.jpg" onclick="openViewer(this.src)">
  <img src="tika.jpg" onclick="openViewer(this.src)">
  <img src="tawn.jpg" onclick="openViewer(this.src)">
  <img src="hari.jpg" onclick="openViewer(this.src)">
  <img src="street3.jpg" onclick="openViewer(this.src)">
  <img src="kyoto.jpg" onclick="openViewer(this.src)">
  <img src="New York 6.jpg" onclick="openViewer(this.src)">
  <img src="window.jpg" onclick="openViewer(this.src)">
  <img src="paris.jpg" onclick="openViewer(this.src)">
  <img src="sky.jpg" onclick="openViewer(this.src)">
  <img src="street.jpg" onclick="openViewer(this.src)">
  <img src="New York6.jpg" onclick="openViewer(this.src)">
</div>

<div id="contactPage"> 
  <p>CONTACT</p>
  <form onsubmit="sendMail(event)" style="display:inline-block; text-align:left; font-size:20px;">
    <label><br><input id="mailSubject" type="text" style="width:300px; padding:5px;"></label><br><br>
    <label>message<br><textarea id="mailBody" style="width:300px; height:150px; padding:5px;"></textarea></label><br><br>
    <button type="submit" style="padding:10px 20px; font-size:18px; cursor:pointer;">sendMail</button>
  </form>
</div>

<div id="viewer" class="viewer">
  <span onclick="closeViewer()" style="position:absolute; top:20px; right:30px; font-size:40px; color:white; cursor:pointer;">&times;</span>
  <img id="viewerImg" src="" />
</div>

<script>
function showMenu() {
  document.querySelector('.header').textContent = 'Ustubo Kento';
  document.getElementById('hero').style.display = 'block';
  document.getElementById('workGallery').style.display = 'none';
  document.getElementById('beautyGallery').style.display = 'none';
  document.getElementById('contactPage').style.display = 'none';

  document.getElementById('workBtn').style.display = 'inline-block';
  document.getElementById('beautyBtn').style.display = 'inline-block';
  document.getElementById('contactBtn').style.display = 'inline-block';
}

function showWork() {
  document.querySelector('.header').textContent = 'WORK';
  document.getElementById('hero').style.display = 'none';
  document.getElementById('workGallery').style.display = 'grid';
  document.getElementById('beautyGallery').style.display = 'none';
  document.getElementById('contactPage').style.display = 'none';
}

function showBeauty() {
  document.querySelector('.header').textContent = 'BEAUTY';
  document.getElementById('hero').style.display = 'none';
  document.getElementById('workGallery').style.display = 'none';
  document.getElementById('beautyGallery').style.display = 'grid';
  document.getElementById('contactPage').style.display = 'none';
}

function showContact() {
  document.querySelector('.header').textContent = 'CONTACT';
  document.getElementById('hero').style.display = 'none';
  document.getElementById('workGallery').style.display = 'none';
  document.getElementById('beautyGallery').style.display = 'none';
  document.getElementById('contactPage').style.display = 'block';
}

function openViewer(src) {
  document.getElementById('viewerImg').src = src;
  document.getElementById('viewer').style.display = 'flex';
}

function closeViewer() {
  document.getElementById('viewer').style.display = 'none';
}

function sendMail(e){
  e.preventDefault();
  const subject = encodeURIComponent(document.getElementById('mailSubject').value);
  const body = encodeURIComponent(document.getElementById('mailBody').value);
  window.location.href = `mailto:yourname@gmail.com?subject=${subject}&body=${body}`;
}
</script>

</body>
</html>
