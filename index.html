<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Serif+Display:ital@0;1&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kento Utsubo Portfolio</title>
<style>
body{
  margin:0;
  font-family: "DM Serif Display", serif;
  background:#f5f4f2;
  color:#98996e;

  min-height:100vh;
  display:flex;
  flex-direction:column;
}


/* ===== HERO ===== */
.hero{
  position:relative;
  width:100%;
  min-height:100vh; /* ← height ではなく min-height */
  background:url('hero.jpg') center/cover no-repeat;
}


.title{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
}

.title h1{
  font-size:14px;
  letter-spacing:0.2em;
  margin:0;
}

.title h2{
  font-size:26px;
  letter-spacing:0.25em;
  margin:10px 0 20px;
}

.title .menu-label{
  font-size:14px;
  letter-spacing:0.3em;
}

/* ===== MENU + THUMB ===== */
.menu{
  position:absolute;
  top:700px;
  left:50%;
  
  transform:translate(-50%,-50%);
  text-align:center;
}

.menu-item{
  margin:30px 0;
  cursor:pointer;
  text-decoration: none;
  color:#98996e;
}

.menu-item div{
  font-size:18px;
  letter-spacing:0.3em;
  margin-bottom:10px;
}

.menu-item img{
  width:320px;
}

.menu-item:hover{opacity:0.6;}

/* ===== SECTION ===== */
section{
  display:none;
  padding:80px 40px;
}

section.active{display:block;}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}

.grid img{
  width:100%;
}

.caption{
  margin-top:20px;
  font-size:14px;
  line-height:1.8;
}

/* ===== CONTACT ===== */
#contact form{
  position:fixed;
  left:20px;
  bottom:20px;
  background:#fff;
  padding:20px;
  width:300px;
}

input, textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}




@media screen and (max-width:600px){
  .menu{
  position:absolute;
  top:650px;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}



}
</style>
</head>
<body>

<div class="hero">
  <div class="title">
    <h1>PHOTOGRAPHER</h1>
    <h2>KENTO UTSUBO</h2>
    <div class="menu-label">menu</div>
  </div>

  <div class="menu">
    <a class="menu-item" href="work.html">
      <div>WORK</div>
      <img src="30.jpg">
    </a>

    <a class="menu-item" href="beauty.html">
      <div>BEAUTY</div>
      <img src="110st newyork.jpg">
    </a>

    <a class="menu-item" href="profile.html">
      <div>PROFILE</div>
      <img src="a-to.jpg">
    </a>

    <a class="menu-item" href="contact.html">
      <div>CONTACT</div>
      <img src="airpirt.jpg">
    </a>
  </div>
</div>



<section id="beauty">
  <div class="grid">
    <img src="b1.jpg"><img src="b2.jpg"><img src="b3.jpg"><img src="b4.jpg"><img src="b5.jpg">
  </div>
  <div class="caption">Beauty description text</div>
</section>





</body>
</html>
